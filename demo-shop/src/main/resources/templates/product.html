<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${product.name()})}"></head>
<body>
<header th:replace="~{fragments :: bar}"></header>
<main class="page">
    <section>
        <h1 th:text="${product.name()}">A thing</h1>
        <p th:text="${product.description()}">What it is.</p>
        <p class="status" th:text="${product.price()}">1.00 USD</p>
        <p th:if="${order != null}">
            You have bought this already. <a th:href="@{/runs/{id}/order(id=${run.testRunId()})}">See the order</a>
        </p>
        <p th:unless="${order != null}">
            <a th:href="@{/runs/{id}/checkout(id=${run.testRunId()})}">Go to checkout</a>
        </p>
    </section>
    <aside th:replace="~{fragments :: story(${run}, ${order})}"></aside>
</main>
</body>
</html>
