name: release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version component to bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: '25'
  GRADLE_FLAGS: --console=plain -Dorg.gradle.java.installations.auto-download=false

jobs:
  gate:
    name: the gate this release is cut from
    uses: ./.github/workflows/gate.yml

  release:
    name: bump, tag and publish the jar this version was assembled from
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the branch this release is cut from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the JDK the Gradle toolchain asks for
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle, validate both wrappers, restore the Gradle home cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Name the identity the release commit is made under
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump the version this build states, commit it and tag it
        id: bump
        run: |
          version="$(./scripts/release.sh "${{ inputs.bump-type }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Carry the version into the API views this build publishes
        run: |
          ./gradlew writeOpenApi ${{ env.GRADLE_FLAGS }}
          if [ -n "$(git status --porcelain)" ]; then
            git add src/main/resources/static/openapi
            git commit --amend --no-edit
            git tag -f "v${{ steps.bump.outputs.version }}"
          fi
      - name: Push the release commit and its tag together
        run: git push --atomic origin HEAD "v${{ steps.bump.outputs.version }}"
      - name: Build the runnable jar of this version
        run: ./gradlew bootJar ${{ env.GRADLE_FLAGS }}
      - name: Publish the release and attach that jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar" || { echo "::error::bootJar produced no runnable jar"; exit 1; }
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            "$jar"
