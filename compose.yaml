# The whole simulator: application plus database. Nothing else is needed.
#
#   docker compose up --wait     # returns when http://localhost:8080 answers
#   docker compose down          # stops both, keeps the data
#
# The application image is built from the Dockerfile in this directory, inside
# a JDK container, so the only thing this machine needs is Docker.
#
# Working on the simulator from an IDE instead? Start the database on its own:
#
#   docker compose up -d postgres
#
# Tests do not use either container: they start their own Postgres via
# Testcontainers, so the quality gate never depends on anything already
# running on your machine.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: pspsim
      POSTGRES_USER: pspsim
      POSTGRES_PASSWORD: pspsim
    ports:
      # Bound to the loopback interface only. The simulator holds provider
      # credentials and unredacted fixtures; it is not meant to be reachable
      # from outside the machine or its VPN.
      - "127.0.0.1:5432:5432"
    volumes:
      # This image puts PGDATA at /var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as its volume, so the mount below is the one that
      # keeps payments across `docker compose down`.
      - pspsim-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pspsim -d pspsim"]
      interval: 2s
      timeout: 3s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SIMULATOR_BIND_ADDRESS: 0.0.0.0
      SIMULATOR_PUBLIC_BASE_URL: http://localhost:8080
      SIMULATOR_DB_URL: jdbc:postgresql://postgres:5432/pspsim
      SIMULATOR_DB_USERNAME: pspsim
      SIMULATOR_DB_PASSWORD: pspsim
    ports:
      # Loopback only, for the same reason as the database above. Publishing
      # this to a LAN or a VPN exposes the provider credentials and the
      # unredacted request fixtures the simulator records.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        # Flyway runs at startup, so the first run must not race the database.
        condition: service_healthy
    healthcheck:
      # The JRE image carries no curl, so this asks the readiness probe over
      # one of bash's own TCP connections.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  pspsim-postgres-data:
