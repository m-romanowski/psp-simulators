# Every version here is pinned exactly. No dynamic versions, no ranges.
[versions]
springBoot = "4.1.1"
spotless = "8.10.2"
googleJavaFormat = "1.36.1"
ktfmt = "0.64"
errorpronePlugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.1"
jspecify = "1.0.1"
archunit = "1.5.0"
checkstyle = "14.1.0"
sonarqube = "7.5.0.8588"
pitestPlugin = "1.19.0"
pitest = "1.30.0"
pitestJunit5 = "1.2.3"
jacoco = "0.8.15"
htmx = "4.0.0"
swaggerUi = "5.32.15"
junitForBuildLogic = "6.0.3"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
pitest = { module = "org.pitest:pitest", version.ref = "pitest" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitestJunit5" }
htmx = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }
swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swaggerUi" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
